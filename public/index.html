<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3a5a40" />
    <meta
      name="description"
      content="Discover your perfect fragrance with expert recommendations and reviews. Explore premium scents and exclusive offers."
    />
    <meta name="keywords" content="fragrances, perfume, cologne, luxury fragrances, scent recommendations, FragranceShop, signature scent" />
    <meta name="author" content="Fragrance Guide" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Fragrance Guide | Premium Fragrance Recommendations" />
    <meta property="og:description" content="Discover your perfect fragrance with expert recommendations and reviews. Explore premium scents and exclusive offers." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourdomain.com/" />
    <meta property="twitter:title" content="Fragrance Guide | Premium Fragrance Recommendations" />
    <meta property="twitter:description" content="Discover your perfect fragrance with expert recommendations and reviews. Explore premium scents and exclusive offers." />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Fragrance Guide | Premium Fragrance Recommendations</title>
    <link rel="canonical" href="https://yourdomain.com/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    
    <!-- Schema.org markup for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Fragrance Guide",
        "url": "https://yourdomain.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://yourdomain.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Fragrance Guide",
        "url": "https://yourdomain.com/",
        "logo": "https://yourdomain.com/logo192.png",
        "sameAs": [
          "https://facebook.com/yourpage",
          "https://instagram.com/yourpage",
          "https://pinterest.com/yourpage"
        ]
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX'); // Replace with your actual Google Analytics ID
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
